name: Upstream Watch

# Daily check whether AHouseOfBards/Bonfire-JellyProfiles has commits this fork has not
# merged yet. It only opens (or refreshes) an issue — it never merges anything. Merging is
# done by hand after reading the diff; see FORK.md.

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  watch:
    if: github.repository == 'OleRaehcke/Bonfire-JellyProfiles'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare with upstream and report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          UPSTREAM=AHouseOfBards/Bonfire-JellyProfiles
          git fetch --no-tags "https://github.com/${UPSTREAM}.git" +refs/heads/main:refs/remotes/upstream/main

          COUNT=$(git rev-list --count HEAD..upstream/main)
          echo "Upstream commits not merged: ${COUNT}"
          [ "$COUNT" -eq 0 ] && exit 0

          LATEST=$(gh release view --repo "$UPSTREAM" --json tagName --jq .tagName 2>/dev/null || echo "?")
          {
            echo "Upstream has **${COUNT}** commit(s) that are not in this fork."
            echo
            echo "Latest upstream release: \`${LATEST}\`"
            echo
            echo "Diff: https://github.com/${GITHUB_REPOSITORY}/compare/main...AHouseOfBards:Bonfire-JellyProfiles:main"
            echo
            echo '```'
            git log --no-merges --format='%h %ad %s' --date=short HEAD..upstream/main | head -60
            echo '```'
            echo
            echo "Review, then merge locally — see FORK.md. This issue is updated daily and can be closed after the merge."
          } > body.md

          gh label create upstream-update --color FBCA04 --description "New commits upstream" --force >/dev/null
          NUM=$(gh issue list --label upstream-update --state open --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue edit "$NUM" --title "Upstream: ${COUNT} new commit(s), latest ${LATEST}" --body-file body.md
          else
            gh issue create --label upstream-update --title "Upstream: ${COUNT} new commit(s), latest ${LATEST}" --body-file body.md
          fi
